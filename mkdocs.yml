site_name: ACTF Architecture Guide
site_description: Enterprise LLMOps & Automated Continuous Training Architecture
site_url: https://actf-ecosystem.github.io/actf-guide/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: blue
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - attr_list

nav:
  - Home: index.md
  - 01 Foundations:
      - 01 Foundations Overview: docs/01_foundations/index.md
      - 01 Enterprise LLMOps: docs/01_foundations/01_the_enterprise_llmops.md
      - 02 Continuous Training Role: docs/01_foundations/02_the_continuous_training_role.md
      - 03 Medallion Architecture: docs/01_foundations/03_the_medallion_architecture.md
      - 04 Decoupled Workflow: docs/01_foundations/04_decoupled_workflow.md
      - 05 Closed-Loop Guardrails: docs/01_foundations/05_closed_loop_guardrails.md
  - 02 Pipelines:
